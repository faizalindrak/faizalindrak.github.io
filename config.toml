baseURL = 'https://faizalindrak.github.io/'
languageCode = 'id_ID'
title = 'Faizal Kusmawan'
theme = 'papermodified'

[params]
Description = "The personal website and blog about Excel and Google Sheets"
defaultTheme = 'light'
disableThemeToggle = false
ShowShareButtons = true
ShareButtons = ["whatsapp","twitter", "facebook", "linkedin", "telegram"]
DateFormat	= "2 January 2006"
ShowReadingTime = true

[assets]
favicon = "/favicon.ico"
favicon16x16 = "/favicon-16x16.png"
favicon32x32 = "/favicon-32x32.png"
appleTouchIcon = "/apple-touch-icon.png"

[outputs]
home = [ "HTML", "RSS", "JSON" ]

